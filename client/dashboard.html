<!DOCTYPE html>
<html>

<head>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d6efd">
<title>Dashboard</title>

<link rel="stylesheet"
href="css/style.css">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body>

<nav class="navbar navbar-dark bg-primary">
<div class="container">

<h3 class="text-white">
Micro Learning Dashboard
</h3>

<button
onclick="logout()"
class="btn btn-danger">
Logout
</button>

</div>
</nav>

<div class="container mt-5">

<div class="card p-4">

<h2 id="welcome"></h2>

<hr>

<h4>
Completed Lessons
</h4>

<h1 id="completedCount">
0
</h1>

<div class="progress">

<div
id="progressBar"
class="progress-bar"
style="width:0%">
0%

</div>

</div>

<br>

<a href="courses.html"
class="btn btn-success">

View Courses

</a>

</div>

</div>

<script>

const user =
JSON.parse(
localStorage.getItem(
"loggedUser"
)
);

if(user){

document.getElementById(
"welcome"
).innerText =
"Hello, " + user.name;

}

function logout(){

localStorage.removeItem(
"loggedUser"
);

window.location.href =
"login.html";

}

</script>
<script src="js/db.js"></script>
<script src="js/dashboard.js"></script>

</body>
</html>
